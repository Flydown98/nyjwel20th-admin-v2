<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5e338c">
<title>내 좌석 안내 · 남양주시장애인복지관 20주년</title>
<link rel="stylesheet" href="/seat-guide.css?v=0.9.2">
</head>
<body>
<main class="guide">
  <header class="guide-head">
    <div class="brand">남양주시장애인복지관 · 20주년</div>
    <h1>내 좌석 안내</h1>
    <p id="guideMsg">좌석 정보를 불러오는 중입니다.</p>
  </header>

  <section id="seatCard" class="seat-card">
    <span class="seat-label">MY SEAT</span>
    <strong id="mySeat">확인 중</strong>
    <small id="myName"></small>
  </section>

  <section class="cinema">
    <div class="screen">SCREEN · 무대</div>
    <div class="screen-glow"></div>
    <div id="seatMap" class="seat-map-public" aria-label="좌석 배치도"></div>
    <div class="legend">
      <span><i class="dot mine"></i> 내 좌석</span>
      <span><i class="dot normal"></i> 좌석</span>
      <span><i class="aisle-box"></i> 중앙 통로</span>
    </div>
  </section>

  <p class="foot">현장 상황에 따라 안내된 좌석이 변경될 수 있습니다. 변경 시 현장 스태프 안내를 따라주세요.</p>
</main>
<script src="/seat-guide.js?v=0.9.2"></script>
</body>
</html>
