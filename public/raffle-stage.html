<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0710">
<title>20주년 행운권 무대화면</title>
<link rel="stylesheet" href="/raffle-stage.css?v=0.9.1">
</head>
<body>
<main id="stage" class="stage idle">
  <div class="ambient"><i></i><i></i><i></i></div>
  <header>
    <span>NYJWEL · 20TH ANNIVERSARY</span>
    <b>LUCKY DRAW</b>
  </header>
  <section class="hero">
    <div id="prize" class="prize">행운권 추첨</div>
    <div id="reel" class="reel"><div id="track" class="track"></div><div class="focus"></div><div class="shade top"></div><div class="shade bottom"></div></div>
    <div id="idleTitle" class="idle-title"><strong>20</strong><span>스무번의 계절, 스물한 번째 약속</span></div>
    <div id="status" class="status">진행자 화면에서 추첨을 시작해주세요</div>
  </section>
  <section id="winner" class="winner hidden">
    <div class="winner-kicker">CONGRATULATIONS</div>
    <div id="winnerName" class="winner-name"></div>
    <div id="winnerSeat" class="winner-seat"></div>
    <div id="winnerPrize" class="winner-prize"></div>
  </section>
  <div id="particles" class="particles"></div>
</main>
<script src="/raffle-stage.js?v=0.9.1"></script>
</body>
</html>
