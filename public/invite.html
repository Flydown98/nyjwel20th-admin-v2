<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4d2677">
<title>개관 20주년 초대장 | 남양주시장애인복지관</title>
<link rel="stylesheet" href="/invite.css?v=0.9.17">
</head>
<body>
<main class="page">
  <section class="hero">
    <div class="twenty">20</div>
    <p class="org">남양주시장애인복지관</p>
    <h1>개관 20주년 기념행사</h1>
    <p class="slogan">스무번의 계절, 스물한 번째 약속</p>
  </section>

  <section id="lookupCard" class="card lookup-card">
    <p class="eyebrow">INVITATION LOOKUP</p>
    <h2>나의 초대장 확인</h2>
    <p class="desc">사전 등록 시 입력한 성함과 휴대전화번호를 입력해 주세요.</p>
    <form id="lookupForm" autocomplete="off">
      <label>성함<input id="lookupName" name="name" autocomplete="name" maxlength="30" required placeholder="예: 홍길동"></label>
      <label>휴대전화번호<input id="lookupPhone" name="phone" type="tel" inputmode="numeric" autocomplete="tel" maxlength="14" required placeholder="010-0000-0000"></label>
      <button id="lookupButton" class="primary" type="submit">초대장 확인하기</button>
    </form>
    <p id="message" class="message" aria-live="polite"></p>
  </section>

  <section id="inviteCard" class="card invitation hidden" aria-live="polite">
    <div class="invite-head">
      <p class="eyebrow">YOU ARE INVITED</p>
      <h2><span id="guestName"></span>님을 초대합니다</h2>
      <p id="guestOrg" class="muted"></p>
    </div>
    <div class="event-info">
      <div><span>일시</span><strong id="eventDate"></strong></div>
      <div><span>장소</span><strong id="eventVenue"></strong></div>
      <div><span>좌석</span><strong id="guestSeat"></strong></div>
      <div><span>신청인원</span><strong id="guestCount"></strong></div>
    </div>
    <div class="qr-wrap">
      <img id="guestQr" alt="개인 입장 QR 코드">
      <p>행사 당일 접수대에서 QR을 보여주세요.</p>
    </div>
    <div id="arrivalBadge" class="arrival hidden">현장 접수 완료</div>
    <a id="seatGuideLink" class="secondary" href="#" target="_blank" rel="noopener">좌석 위치 확인</a>
    <button id="lookupAgain" class="text-button" type="button">다른 초대장 조회</button>
  </section>

  <footer>
    <strong>남양주시장애인복지관</strong>
    <span>2026. 9. 17.(목) · 남양주금곡실내체육관</span>
  </footer>
</main>
<script src="/invite.js?v=0.9.17"></script>
</body>
</html>
